name: Validate app and security boundaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COPILOT_MARKETING_PASSWORD: ci-marketing-${{ github.run_id }}-${{ github.run_attempt }}
      COPILOT_HR_PASSWORD: ci-hr-${{ github.run_id }}-${{ github.run_attempt }}
      COPILOT_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python source
        run: python -m compileall -q server.py altiusnxt_core.py launch_agent.py smoke_test.py stop_agent.py agent_status.py

      - name: Check role policy and upload handling
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end smoke test
        run: python smoke_test.py

      - name: Scan current working tree for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$GITLEAKS_IMAGE" \
            dir --redact --exit-code 1 /repo
